name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Display Python version
      run: python -c "import sys; print(f'Python {sys.version}')"
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ Dependencies installed successfully"
    
    - name: List directory structure
      run: |
        echo "📁 Project structure:"
        find . -type f -name '*.py' | head -20
        echo ""
        echo "📦 Python path check:"
        python -c "import sys; print('\n'.join(sys.path))"
    
    - name: Run tests
      run: |
        cd ${{ github.workspace }}
        echo "🧪 Running tests..."
        python -m pytest tests/test_wagi_ai.py -v -s --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}
    
    - name: Lint with flake8
      run: |
        echo "🔍 Running flake8..."
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️  Lint warnings found"
      continue-on-error: true
    
    - name: Format check with black
      run: |
        echo "🎨 Checking code format with black..."
        black --check src/ tests/ || echo "⚠️  Format issues found"
      continue-on-error: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t wagi-ai:latest .
        echo "✅ Docker image built successfully"
    
    - name: Deploy notification
      run: |
        echo "🚀 WAGI AI deployment ready!"
        echo "Image: wagi-ai:latest"
        echo "Run: docker run -p 8000:8000 wagi-ai:latest"
